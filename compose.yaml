name: nexus-v1-local
services:
  postgres:
    image: postgres:15.16
    environment:
      POSTGRES_DB: nexus_local
      POSTGRES_USER: nexus_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - nexus_postgres:/var/lib/postgresql/data
      - ./ops/postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d nexus_local"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  nexus_postgres:
