spring.application.name=nexus
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never

# Migrations use a separate schema-owner connection; application SQL is restricted.
spring.datasource.hikari.schema=nexus
spring.jpa.properties.hibernate.default_schema=nexus
spring.flyway.url=${DB_URL}
spring.flyway.user=${MIGRATION_DB_USERNAME}
spring.flyway.password=${MIGRATION_DB_PASSWORD}
spring.flyway.default-schema=nexus
spring.flyway.schemas=nexus
spring.flyway.create-schemas=false
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.placeholders.runtimeRole=${DB_USERNAME}
